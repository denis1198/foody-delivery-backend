spring:
  application:
    name: foody-delivery
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/foody.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Em produção, defina JWT_SECRET com pelo menos 32 caracteres.
    secret: ${JWT_SECRET:dev-secret-foody-delivery-change-me-0123456789}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # Popula o banco vazio com restaurantes e ~90 dias de pedidos de demonstração.
    enabled: ${SEED_DEMO_DATA:true}
